<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Product list with cart</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 13px;
        text-align: center;
        padding: 1.25rem 1rem;
        color: var(--rose-500);
        letter-spacing: 0.01em;
      }

      .attribution a {
        color: var(--red);
        text-decoration: none;
        font-weight: 600;
        border-bottom: 1.5px solid transparent;
        transition:
          border-color 0.2s ease,
          color 0.2s ease;
      }

      .attribution a:hover {
        border-bottom-color: var(--red);
      }
    </style>
  </head>

  <body>
    <main class="main">
      <p class="text-1">Desserts</p>

      <!-- Product List -->
      <div class="container">
        <section class="product-list">
          <!-- Product Card -->
        </section>

        <section class="pay-section">
          <p class="text-2 head-quantity">Your Cart (0)</p>

          <div class="empty-card">
            <img src="./assets/images/illustration-empty-cart.svg" alt="" />
            <p>Your added items will appear here</p>
          </div>

          <div class="your-card-section">
            <!-- <div class="your-card-product-container">
         
           <div class="your-card-product-name">
            <p class="text-2">vanila</p>

            <div class="your-card-product-details">
              <p class="yc-product-quantity textBold-4">quantity</p>
              <p class="yc-product-price">@ 6.50</p>
              <p class="yc-product-total-price">39.00</p>
            </div>
          </div>
          <div class="your-card-image-remove">
            <img src="./assets/images/icon-remove-item.svg" alt="">
          </div> 
        </div>  -->
          </div>

          <div class="your-card-total">
            <p class="text-4">Order Total</p>
            <p class="total-price text-2">$0</p>
          </div>

          <div>
            <button class="buttonConfirm">Confirm Order</button>
          </div>
        </section>
      </div>

      <div class="modal" role="dialog" aria-modal="true" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <img src="./assets/images/icon-order-confirmed.svg" alt="" />
              <h5 class="modal-title text-1">Order Confirmed</h5>
              <p class="modal-title-sub">We hope you enjoy your food!</p>
            </div>
            <div class="modal-body">
              <!-- Satilan Ürünler -->
            </div>
            <div class="modal-footer">
              <button type="button" class="buttonNewOrder">
                Start New Order
              </button>
            </div>
          </div>
        </div>
      </div>

      <footer class="attribution">
        <p>
          Challenge by
          <a
            href="https://www.frontendmentor.io?ref=challenge"
            target="_blank"
            rel="noopener"
            >Frontend Mentor</a
          >. Coded by
          <a
            href="https://github.com/cankurtduygu/product-list-with-cart-main"
            target="_blank"
            rel="noopener"
            >cankurtduygu</a
          >.
        </p>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
